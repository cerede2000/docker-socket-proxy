name: Release

# Une sortie était une suite de gestes manuels, et les deux qui ont déjà raté
# sont ceux que ce workflow refuse maintenant : une section de CHANGELOG mal
# formée, et un tag posé sur une CI qui n'était pas verte.
#
# Le push a besoin d'un jeton personnel (`RELEASE_TOKEN`, contents: write).
# Un push effectué avec le GITHUB_TOKEN par défaut ne déclenche aucun autre
# workflow : main et le tag avanceraient sans que rien ne construise ni ne
# publie d'image. C'est une contrainte de GitHub, pas un choix.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à sortir, sans le v (ex. 1.3.2)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ inputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check the release token is present
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TOKEN}" ]; then
            cat >&2 <<'MSG'
          Le secret RELEASE_TOKEN est absent.

          Un push fait avec le GITHUB_TOKEN par défaut ne déclenche pas les
          workflows « on: push », donc ni l'image ni les signatures ne seraient
          produites. Créer un jeton à portée fine sur ce dépôt avec la
          permission « Contents: read and write » et l'enregistrer sous
          RELEASE_TOKEN.
          MSG
            exit 1
          fi

      - name: Checkout integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: integration
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Validate the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            v*) echo "donner la version sans le v : ${VERSION#v}" >&2; exit 1 ;;
          esac
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version attendue sous la forme x.y.z, reçu « $VERSION »" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "le tag v${VERSION} existe déjà" >&2
            exit 1
          fi

      # La section doit déjà porter sa date : promouvoir « Unreleased » au
      # moment de la sortie est exactement le geste qui a écrit deux fois des
      # entrées dans une version déjà publiée.
      - name: Extract the changelog section
        id: notes
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! grep -qE "^## ${VERSION} - [0-9]{4}-[0-9]{2}-[0-9]{2}\$" CHANGELOG.md; then
            echo "CHANGELOG.md n'a pas de section « ## ${VERSION} - AAAA-MM-JJ »" >&2
            echo "Sections présentes :" >&2
            grep -E '^## ' CHANGELOG.md | head -n 5 >&2
            exit 1
          fi
          awk -v v="## ${VERSION} - " '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "la section ${VERSION} du CHANGELOG est vide" >&2
            exit 1
          fi
          echo "Notes extraites :"; cat release-notes.md

      # Un tag posé sur du rouge ne se rattrape pas : il est déjà public.
      - name: Require a green integration head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/check-runs" \
            --jq '.check_runs[] | "\(.name)|\(.status)|\(.conclusion // "-")"')"
          if [ -z "$runs" ]; then
            echo "aucun contrôle sur ${sha} : rien ne prouve que cette tête est saine" >&2
            exit 1
          fi
          printf '%s\n' "$runs" | awk -F'|' '{print "  "$1": "$2"/"$3}'
          if printf '%s\n' "$runs" | awk -F'|' '$2 != "completed"' | grep -q .; then
            echo "des contrôles sont encore en cours sur ${sha}" >&2
            exit 1
          fi
          if printf '%s\n' "$runs" | awk -F'|' '$3 != "success" && $3 != "skipped" && $3 != "neutral"' | grep -q .; then
            echo "des contrôles ont échoué sur ${sha}" >&2
            exit 1
          fi

      - name: Require main to fast-forward
        run: |
          set -euo pipefail
          git fetch -q origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "main n'est pas un ancêtre d'integration : la sortie demanderait une fusion" >&2
            exit 1
          fi

      # main et le tag partent dans le même push, donc les deux workflows
      # déclenchés construisent le même commit.
      - name: Advance main and tag the release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}" \
            -m "Notes de sortie : https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}"
          git push origin "HEAD:main" "refs/tags/v${VERSION}"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
