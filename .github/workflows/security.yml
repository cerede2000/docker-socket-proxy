name: Security

# Le cron est le cœur de ce workflow : une vulnérabilité publiée contre du code
# qui n'a pas bougé n'est jamais vue par une CI qui ne tourne qu'au push.
on:
  push:
    branches:
      - main
      - integration
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:${{ matrix.language }}

  govulncheck:
    name: Vulnerability audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    # Sans ce verrou, go remplacerait le toolchain extrait du Dockerfile dès
    # que go.mod en réclame un plus récent, et l'audit retomberait sur le
    # dernier correctif disponible.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # L'audit doit porter sur le Go qui part dans l'image, pas sur le dernier
      # correctif publié. `check-latest` faisait l'inverse : il masquait le
      # retard du toolchain épinglé au lieu de le révéler, et les CVE de la
      # 1.27.1 sont restées invisibles ici jusqu'à ce que le registre les
      # signale.
      - name: Read the Go toolchain pinned by the Dockerfile
        id: toolchain
        run: |
          version="$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)-alpine.*/\1/p' Dockerfile | head -n 1)"
          if [ -z "$version" ]; then
            echo "aucune version golang:<x.y.z>-alpine trouvée dans le Dockerfile" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: false

      - name: Run govulncheck
        run: |
          { go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -format sarif ./... || :; } | tee ./govulncheck.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: ./govulncheck.sarif
          category: govulncheck

      # Le SARIF alimente l'onglet Security ; cette étape fait échouer le
      # workflow pour que le cron hebdomadaire notifie au lieu de passer sous
      # silence.
      - name: Fail on findings
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
