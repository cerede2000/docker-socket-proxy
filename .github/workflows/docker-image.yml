name: Test and publish production image

on:
  push:
    branches:
      - main
      - integration
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/docker-socket-proxy

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The toolchain must come from the Dockerfile and nowhere else, so go may
    # not substitute a newer one behind the pin.
    env:
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `go 1.27` in go.mod resolved to whatever patch was current, so the
      # toolchain moved on its own under a pinned Staticcheck: 1.27.2 changed
      # the export data format and 2026.2.1 stopped being able to read it,
      # which failed every pull request at once, including the one bumping the
      # image. Reading the pin instead ties that move to a reviewed change.
      - name: Read the Go toolchain pinned by the Dockerfile
        id: toolchain
        run: |
          version="$(sed -n 's/^FROM .*golang:\([0-9][0-9.]*\)-alpine.*/\1/p' Dockerfile | head -n 1)"
          if [ -z "$version" ]; then
            echo "aucune version golang:<x.y.z>-alpine trouvée dans le Dockerfile" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.toolchain.outputs.version }}
          cache: false

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        uses: dominikh/staticcheck-action@9716614d4101e79b4340dd97b10e54d68234e431 # v1
        with:
          version: "2026.2.2"
          install-go: false
          use-cache: false

      - name: Test
        run: go test -race ./...

      - name: Vulnerability audit
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      # Un seul arch suffit pour le scan : les avis portent sur le toolchain et
      # les modules, identiques d'une architecture à l'autre. Le build multi-arch
      # au-dessus reste la preuve de la compilation croisée.
      - name: Build the image to scan (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/amd64
          tags: docker-socket-proxy:ci-scan
          provenance: false
          sbom: false

      # Ce dépôt n'auditait que ses sources : le toolchain en retard dans
      # l'image n'était visible d'aucune porte, et c'est le registre qui a
      # signalé les avis du 2026-10-08. Trivy lit la version inscrite dans le
      # binaire, donc il juge ce que l'image embarque, pas ce que go.mod
      # déclare. L'image est `scratch`, il n'y a pas de paquet système à
      # trouver : le périmètre est volontairement large, car un constat
      # corrigeable sur trois composants se corrige tout de suite.
      - name: Scan the built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: docker-socket-proxy:ci-scan
          version: v0.72.0
          format: table
          scanners: vuln
          vuln-type: library
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "1"

  e2e:
    name: End-to-end
    needs: ["test"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Le runner fournit déjà un démon Docker : la suite construit l'image puis
      # éprouve la découverte par label, la portée conteneur, le filtrage des
      # réponses et le frontend socket unix contre ce démon.
      - name: Run end-to-end suite
        run: ./e2e/run.sh

      - name: Upload proxy log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-proxy-log
          path: e2e/proxy.log
          if-no-files-found: ignore

  publish:
    if: github.event_name != 'pull_request'
    needs: ["test", "e2e"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Prepare optional Docker Hub image
        id: dockerhub
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "image=$DOCKERHUB_USERNAME/docker-socket-proxy" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ steps.dockerhub.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=integration,enable=${{ github.ref == 'refs/heads/integration' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push production image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            APP_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # La page Docker Hub ne suit aucun push : elle restait sur la description
      # d'une version antérieure jusqu'à ce que quelqu'un la modifie à la main.
      - name: Sync the Docker Hub description
        if: env.DOCKERHUB_USERNAME != '' && startsWith(github.ref, 'refs/tags/v')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ steps.dockerhub.outputs.image }}
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign published images
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "no tags to sign"
            exit 0
          fi
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            cosign sign --yes "$tag@$DIGEST"
          done <<EOF
          $TAGS
          EOF
